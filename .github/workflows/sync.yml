name: Sync mypkgs

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 */5 * *'  # 每月按 1/6/11/16/21/26/31 日巡检

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set git identity
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      # ------------------------------------------------------------
      # 安装 OpenWrt 基础检查依赖，防止 make check 报错
      # ------------------------------------------------------------
      - name: Install OpenWrt Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gawk gettext file unzip bzip2 wget python3 perl

      # ------------------------------------------------------------
      # msd_lite (框架跟 ImmortalWrt、源码跟 upstream)
      # ------------------------------------------------------------
      - name: Update msd_lite
        shell: bash
        run: |
          set -euo pipefail

          REPO="https://github.com/rozhuk-im/msd_lite.git"
          PACKAGE_DIR="msd_lite"
          MAKEFILE="${PACKAGE_DIR}/Makefile"

          # 1. 同步 ImmortalWrt 最新的打包框架
          echo "Syncing base package framework from immortalwrt..."
          rm -rf temp-pkgs
          git clone --depth=1 https://github.com/immortalwrt/packages.git temp-pkgs
          rm -rf msd_lite
          rsync -a --delete temp-pkgs/net/msd_lite/ msd_lite/
          rm -rf temp-pkgs

          # [防护增强 1] 检查 ImmortalWrt 的 Makefile 是否仍精确指向原作者仓库
          SOURCE_URL="$(sed -n 's/^PKG_SOURCE_URL:=//p' "$MAKEFILE")"
          if [ "$SOURCE_URL" != "$REPO" ]; then
            echo "ERROR: Unexpected PKG_SOURCE_URL:"
            echo "       $SOURCE_URL"
            echo "Expected:"
            echo "       $REPO"
            exit 1
          fi

          # [防护增强 2] 确保 Makefile 中只有一个 PKG_SOURCE_VERSION
          SOURCE_VERSION_COUNT="$(grep -c '^PKG_SOURCE_VERSION:=' "$MAKEFILE" || true)"
          if [ "$SOURCE_VERSION_COUNT" -ne 1 ]; then
            echo "ERROR: Expected exactly one PKG_SOURCE_VERSION, found $SOURCE_VERSION_COUNT"
            exit 1
          fi

          # 2. 检查真实源码最新状态
          echo "Checking latest msd_lite commit..."
          LATEST_COMMIT="$(git ls-remote "$REPO" HEAD | awk '{print $1}')"

          if [ -z "$LATEST_COMMIT" ]; then
            echo "ERROR: Failed to get latest commit"
            exit 1
          fi

          CURRENT_COMMIT="$(sed -n 's/^PKG_SOURCE_VERSION:=//p' "$MAKEFILE")"

          echo "Current frame commit: $CURRENT_COMMIT"
          echo "Latest source commit : $LATEST_COMMIT"

          if [ "$CURRENT_COMMIT" = "$LATEST_COMMIT" ]; then
            echo "msd_lite is already up to date with upstream."
            exit 0 # 退出当前 step，继续后续插件的同步
          fi

          echo "msd_lite has a new upstream commit. Proceeding with update..."

          # 3. 获取源码的日期
          git clone --filter=blob:none --no-checkout "$REPO" temp-msd-lite
          cd temp-msd-lite
          git checkout --quiet "$LATEST_COMMIT"
          SOURCE_DATE="$(git show -s --format=%cs "$LATEST_COMMIT")"
          echo "New source date: $SOURCE_DATE"
          cd ..
          rm -rf temp-msd-lite

          # 4. 克隆 OpenWrt 官方构建系统用于原生计算哈希
          git clone --depth=1 https://github.com/openwrt/openwrt.git temp-openwrt
          mkdir -p temp-openwrt/package/mypkgs/msd_lite
          cp -a "$PACKAGE_DIR"/. temp-openwrt/package/mypkgs/msd_lite/

          cd temp-openwrt

          # 修改 Makefile 为最新的 commit 和 date
          sed -i "s/^PKG_SOURCE_DATE:=.*/PKG_SOURCE_DATE:=${SOURCE_DATE}/" package/mypkgs/msd_lite/Makefile
          sed -i "s/^PKG_SOURCE_VERSION:=.*/PKG_SOURCE_VERSION:=${LATEST_COMMIT}/" package/mypkgs/msd_lite/Makefile
          
          # 清理旧的 Hash
          sed -i '/^PKG_HASH:=/d' package/mypkgs/msd_lite/Makefile
          sed -i '/^PKG_MIRROR_HASH:=/d' package/mypkgs/msd_lite/Makefile

          # 下载并让 OpenWrt 自动计算生成最新哈希
          make package/mypkgs/msd_lite/download V=s
          make package/mypkgs/msd_lite/check FIXUP=1 V=s

          # [防护增强 3] 强校验：Git package 必须生成合法的 PKG_MIRROR_HASH
          HASH_VALUE="$(sed -n 's/^PKG_MIRROR_HASH:=//p' package/mypkgs/msd_lite/Makefile)"
          if ! echo "$HASH_VALUE" | grep -qE '^[0-9a-fA-F]{64}$'; then
            echo "ERROR: Invalid or missing PKG_MIRROR_HASH:"
            echo "$HASH_VALUE"
            exit 1
          fi

          # 5. 将处理好带有正确 Hash 的 Makefile 拷贝回我们自己的仓库
          cp package/mypkgs/msd_lite/Makefile "../${PACKAGE_DIR}/Makefile"
          cd ..
          rm -rf temp-openwrt

          echo "Final msd_lite Makefile headers updated successfully!"

      # ------------------------------------------------------------
      # luci-app-msd_lite
      # ------------------------------------------------------------
      - name: Fetch luci-app-msd_lite
        run: |
          set -e
          rm -rf temp-luci
          git clone --depth=1 https://github.com/immortalwrt/luci.git temp-luci
          rm -rf luci-app-msd_lite
          rsync -a --delete temp-luci/applications/luci-app-msd_lite/ luci-app-msd_lite/
          rm -rf temp-luci

      # ------------------------------------------------------------
      # wrtbwmon & luci-app-wrtbwmon
      # ------------------------------------------------------------
      - name: Fetch wrtbwmon & luci-app-wrtbwmon
        run: |
          set -e
          rm -rf temp-small-package
          git clone --depth=1 https://github.com/kenzok8/small-package.git temp-small-package
          rm -rf wrtbwmon luci-app-wrtbwmon
          rsync -a --delete temp-small-package/wrtbwmon/ wrtbwmon/
          rsync -a --delete temp-small-package/luci-app-wrtbwmon/ luci-app-wrtbwmon/
          rm -rf temp-small-package

      # ------------------------------------------------------------
      # Commit & Push
      # ------------------------------------------------------------
      - name: Commit & push changes
        run: |
          set -e
          git add msd_lite luci-app-msd_lite wrtbwmon luci-app-wrtbwmon

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Sync mypkgs: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:main
