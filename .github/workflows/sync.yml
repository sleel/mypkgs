name: Sync mypkgs

on:
  workflow_dispatch:
  schedule:
    # 注意：cron 的 day-of-month 字段 */5 并非严格等间隔的“每5天”，
    # 跨月边界会有偏差（例如 1,6,11,16,21,26,31 号触发）。
    # 如需严格等间隔，请在脚本内部用日期判断决定是否跳过执行。
    - cron: '0 0 */5 * *'

# 防止手动触发和定时触发同时运行，导致 push 冲突或 rsync 竞态
concurrency:
  group: sync-mypkgs
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set git identity
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      # ---------- 安装 OpenWrt 构建依赖 ----------
      - name: Install OpenWrt Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential gawk gettext file unzip bzip2 wget python3 perl \
            libncurses-dev libssl-dev zlib1g-dev rsync python3-setuptools \
            swig curl git

      # ---------- 同步 msd_lite (框架从 immortalwrt, 源码从 upstream) ----------
      - name: Update msd_lite
        shell: bash
        run: |
          set -euo pipefail

          REPO="https://github.com/rozhuk-im/msd_lite.git"
          PACKAGE_DIR="msd_lite"
          MAKEFILE="${PACKAGE_DIR}/Makefile"

          # 1. 拉取 ImmortalWrt 最新打包框架
          rm -rf temp-pkgs
          git clone --depth=1 https://github.com/immortalwrt/packages.git temp-pkgs

          if [ ! -d "temp-pkgs/net/msd_lite" ]; then
            echo "ERROR: temp-pkgs/net/msd_lite not found, aborting to avoid wiping local package"
            exit 1
          fi

          rm -rf msd_lite
          rsync -a --delete temp-pkgs/net/msd_lite/ msd_lite/
          rm -rf temp-pkgs

          # 校验源码 URL 是否被意外篡改
          SOURCE_URL="$(sed -n 's/^PKG_SOURCE_URL:=//p' "$MAKEFILE")"
          if [ "$SOURCE_URL" != "$REPO" ]; then
            echo "ERROR: Unexpected PKG_SOURCE_URL: $SOURCE_URL"
            exit 1
          fi

          # 确保 Makefile 仅包含唯一的 PKG_SOURCE_VERSION
          SOURCE_VERSION_COUNT="$(grep -c '^PKG_SOURCE_VERSION:=' "$MAKEFILE" || true)"
          if [ "$SOURCE_VERSION_COUNT" -ne 1 ]; then
            echo "ERROR: Expected exactly one PKG_SOURCE_VERSION"
            exit 1
          fi

          # 2. 检查上游源码更新状态
          LATEST_COMMIT="$(git ls-remote "$REPO" HEAD | awk '{print $1}')"
          if [ -z "$LATEST_COMMIT" ]; then
            echo "ERROR: Failed to get latest commit"
            exit 1
          fi

          CURRENT_COMMIT="$(sed -n 's/^PKG_SOURCE_VERSION:=//p' "$MAKEFILE")"

          if [ "$CURRENT_COMMIT" = "$LATEST_COMMIT" ]; then
            echo "msd_lite is already up to date."
            exit 0 # 无源码更新，跳过后续 hash 计算，但继续同步其他包
          fi

          # 3. 获取最新 commit 的日期
          rm -rf temp-msd-lite
          git clone --filter=blob:none --no-checkout "$REPO" temp-msd-lite
          cd temp-msd-lite
          git checkout --quiet "$LATEST_COMMIT"
          SOURCE_DATE="$(git show -s --format=%cs "$LATEST_COMMIT")"
          cd ..
          rm -rf temp-msd-lite

          # 4. 借助 OpenWrt 原生环境生成 PKG_MIRROR_HASH
          rm -rf temp-openwrt
          git clone --depth=1 https://github.com/openwrt/openwrt.git temp-openwrt
          mkdir -p temp-openwrt/package/mypkgs/msd_lite
          cp -a "$PACKAGE_DIR"/. temp-openwrt/package/mypkgs/msd_lite/
          cd temp-openwrt

          # 生成默认 .config 以跳过 menuconfig 交互
          touch .config
          make defconfig

          # 更新 Makefile 参数并清理旧 Hash
          sed -i "s/^PKG_SOURCE_DATE:=.*/PKG_SOURCE_DATE:=${SOURCE_DATE}/" package/mypkgs/msd_lite/Makefile
          sed -i "s/^PKG_SOURCE_VERSION:=.*/PKG_SOURCE_VERSION:=${LATEST_COMMIT}/" package/mypkgs/msd_lite/Makefile
          sed -i '/^PKG_HASH:=/d' package/mypkgs/msd_lite/Makefile
          sed -i '/^PKG_MIRROR_HASH:=/d' package/mypkgs/msd_lite/Makefile

          # 触发 OpenWrt 下载并生成新 Hash
          make package/mypkgs/msd_lite/download V=s
          make package/mypkgs/msd_lite/check FIXUP=1 V=s

          # 严格校验生成的 SHA256 Hash 格式
          HASH_VALUE="$(sed -n 's/^PKG_MIRROR_HASH:=//p' package/mypkgs/msd_lite/Makefile)"
          if ! echo "$HASH_VALUE" | grep -qE '^[0-9a-fA-F]{64}$'; then
            echo "ERROR: Invalid or missing PKG_MIRROR_HASH: $HASH_VALUE"
            exit 1
          fi

          # 5. 覆盖本地 Makefile
          cp package/mypkgs/msd_lite/Makefile "../${PACKAGE_DIR}/Makefile"
          cd ..
          rm -rf temp-openwrt

      # ---------- 同步 luci-app-msd_lite ----------
      - name: Fetch luci-app-msd_lite
        run: |
          set -euo pipefail
          rm -rf temp-luci
          git clone --depth=1 https://github.com/immortalwrt/luci.git temp-luci

          if [ ! -d "temp-luci/applications/luci-app-msd_lite" ]; then
            echo "ERROR: temp-luci/applications/luci-app-msd_lite not found, aborting to avoid wiping local package"
            exit 1
          fi

          rm -rf luci-app-msd_lite
          rsync -a --delete temp-luci/applications/luci-app-msd_lite/ luci-app-msd_lite/
          rm -rf temp-luci

      # ---------- 同步 wrtbwmon & luci-app-wrtbwmon ----------
      - name: Fetch wrtbwmon & luci-app-wrtbwmon
        run: |
          set -euo pipefail
          rm -rf temp-small-package
          git clone --depth=1 https://github.com/kenzok8/small-package.git temp-small-package

          if [ ! -d "temp-small-package/wrtbwmon" ] || [ ! -d "temp-small-package/luci-app-wrtbwmon" ]; then
            echo "ERROR: expected source dirs not found in small-package repo, aborting to avoid wiping local packages"
            exit 1
          fi

          rm -rf wrtbwmon luci-app-wrtbwmon
          rsync -a --delete temp-small-package/wrtbwmon/ wrtbwmon/
          rsync -a --delete temp-small-package/luci-app-wrtbwmon/ luci-app-wrtbwmon/
          rm -rf temp-small-package

      # ---------- 提交并推送更改 ----------
      - name: Commit & push changes
        run: |
          set -euo pipefail
          git add msd_lite luci-app-msd_lite wrtbwmon luci-app-wrtbwmon

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Sync mypkgs: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          # 使用当前实际分支名，避免硬编码 main 导致推送到错误分支
          BRANCH="${GITHUB_REF_NAME}"
          git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" "HEAD:${BRANCH}"
